# Production stack: Caddy (TLS + basic auth + static UI) -> FastAPI -> Memgraph, with a self-hosted Jikan.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Container logs hold IP addresses (personal data): cap them at 3 x 10 MB per service so old lines are overwritten.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  memgraph:
    # memory-limit (MiB) makes Memgraph refuse work past 2 GiB instead of letting the 4 GB server run out.
    # Pinned to Memgraph 3.13.0. The Ask privacy guard reads its query plans, and its startup self-test
    # (agent.guard_self_test) must pass before you move to a newer image.
    image: memgraph/memgraph-mage@sha256:cc33431b088c6b9580528d8d5aff92f3b958de1af5d40126f831ab8512eb855a
    restart: unless-stopped
    logging: *logging
    command: ["--log-level=WARNING", "--storage-snapshot-interval-sec=300", "--storage-wal-enabled=true", "--query-execution-timeout-sec=30", "--memory-limit=2048"]
    volumes:
      - mg_lib:/var/lib/memgraph
      - mg_log:/var/log/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    restart: unless-stopped
    logging: *logging
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-jikan}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh mongodb://localhost:27017 --quiet --eval 'db.runCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  jikan:
    image: jikanme/jikan-rest:latest
    restart: unless-stopped
    logging: *logging
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=warning
      - DB_CONNECTION=mongodb
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=jikan
      - DB_ADMIN=admin
      - DB_USERNAME=${MONGO_USER:-jikan}
      - DB_PASSWORD=${MONGO_PASSWORD}
      - DB_CACHING=true
      - CACHING=false
      - SCOUT_DRIVER=collection
      - MICROCACHING=false
      - JIKAN_ENABLE_PERIODICAL_FULL_INDEXER=false
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
      - JIKAN_BASE=http://jikan:8080/v4
      - CACHE_DIR=/app/data/cache
      - CONVERSATIONS_DIR=/app/data/conversations
      - GOLF_DIR=/app/data/golf
    volumes:
      - ./data/cache:/app/data/cache
      - ./data/conversations:/app/data/conversations
      - ./data/golf:/app/data/golf
    depends_on:
      memgraph:
        condition: service_healthy
      jikan:
        condition: service_started

  web:
    build: ./web
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost:8088}
    volumes:
      - ./deploy/caddy/users:/etc/caddy/users:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mg_lib:
  mg_log:
  mongo_data:
  caddy_data:
  caddy_config:
