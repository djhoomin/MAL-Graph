[project]
name = "malgraph"
version = "0.1.0"
description = "MyAnimeList as a graph: Jikan/MAL ingestion into Memgraph + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "neo4j>=5.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "openai>=1.50",
]

[project.scripts]
malgraph = "malgraph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["malgraph*"]
